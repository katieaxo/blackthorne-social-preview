function enhanceProfile(){const n=profile,posts=curatedByName(n),stats=document.querySelector('.social-stats');if(stats)stats.innerHTML=`<div><strong>${posts.length}</strong><span>Posts</span></div><div><strong>Wolves</strong><span>Team</span></div><div><strong>✦</strong><span>Sandbox</span></div>`;const preview=document.querySelector('.wolf-preview');if(preview&&selectedWolfPost){const p=posts[selectedWolfPost.index];if(p){preview.innerHTML=`<img class="wolf-preview-photo" src="${esc(p.image)}" alt="${esc(n)} photo">${postPanel(p)}<button class="secondary" onclick="selectedWolfPost=null;render()">Close</button>`}}const bio=document.querySelector('.social-bio');if(bio)bio.insertAdjacentHTML('beforeend',`<div class="chiprow"><button class="secondary" onclick="go('stories');storyIndex=${Math.max(0,storySeeds().findIndex(p=>p.author===n))};render()">◉ Highlights</button><button class="secondary" onclick="go('team')">🏒 Team roster</button></div>`)}
function enhanceFeed(){const holder=document.querySelector('.section-title');if(holder)holder.insertAdjacentHTML('beforebegin',`<div class="chiprow">${people.map(n=>`<button class="chip" onclick="go('stories');storyIndex=${Math.max(0,storySeeds().findIndex(p=>p.author===n))};render()">${avatar(n)}${esc(n.split(' ')[0])}</button>`).join('')}</div>`);if(showWolfFeed){const cards=document.querySelectorAll('.feed-preview-card');cards.forEach((el,i)=>{const p=curatedByName(people[i])[0];if(p)el.insertAdjacentHTML('beforeend',postPanel(p))})}}
function enhanceChats(){if(!thread){const main=$('main');main.insertAdjacentHTML('beforeend',`<div class="social-card"><strong>Wolves group chats</strong><p class="small-note">Choose a group. Only Katie can send her own messages.</p>${Object.keys(chatGroups).filter(x=>x!=='Wolves House 🏒').map(n=>`<button class="item" onclick="openThread(${JSON.stringify(n).replace(/"/g,'&quot;')})">${esc(n)} · Group chat</button>`).join('')}</div>`);return}const group=!!chatGroups[thread],isAI=group||people.includes(thread);const main=$('main');const warn=main.querySelector('.warn');if(warn)warn.textContent='Non-canon sandbox · Katie controls her own messages. AI responses require a configured OpenAI server key.';const oldBtn=main.querySelector('button[onclick="aiReply()"]');if(oldBtn)oldBtn.remove();if(isAI)main.insertAdjacentHTML('beforeend',`<p><button class="primary" onclick="aiReplyV08()" ${aiBusy?'disabled':''}>${aiBusy?'AI is typing…':'✦ Get AI reply'}</button></p><p class="small-note">AI is opt-in: sending a Katie message does not automatically call the API.</p>`)}
async function aiReplyV08(){if(aiBusy||!thread)return;const target=thread;const hist=(data.messages[target]||[]).slice(-16);if(!hist.some(m=>m.by==='Katie')){alert('Katie must send a message first.');return}aiBusy=true;render();try{const response=await fetch('./__preview_ai_disabled__',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({character:target,messages:hist.map(m=>({role:m.by==='Katie'?'user':'assistant',content:m.by==='Katie'?m.text:(m.by+': '+m.text)}))})});const j=await response.json();if(!response.ok)throw Error(j.error||'AI unavailable');if(!j.reply||!j.speaker)throw Error('Invalid AI response');(data.messages[target]??=[]).push({by:j.speaker,text:j.reply,at:new Date().toISOString(),status:'AI sandbox'});save()}catch(e){alert('AI reply unavailable: '+e.message+'\nYour messages remain saved.')}finally{aiBusy=false;render()}}

render();
</script><div id="preview-note" style="position:fixed;bottom:64px;right:10px;z-index:9999;background:#222638;color:#fff;padding:7px 10px;border:1px solid #6f7395;border-radius:10px;font:12px system-ui;pointer-events:none;opacity:.9">PUBLIC PREVIEW · AI replies disabled</div></body></html>
